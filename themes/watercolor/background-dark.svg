<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 800"
  preserveAspectRatio="xMidYMid slice">
  <defs>
    <filter id="w" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence
        type="fractalNoise"
        baseFrequency=".011"
        numOctaves="3"
        seed="7"
        result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="110"/>
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>
  <g filter="url(#w)">
    <circle cx="120" cy="110" r="230" fill="#3f6c9a" fill-opacity="0.55"/>
    <circle cx="1100" cy="160" r="200" fill="#9a4f66" fill-opacity="0.5"/>
    <circle cx="1040" cy="720" r="260" fill="#3f7d6c" fill-opacity="0.5"/>
    <circle cx="150" cy="700" r="200" fill="#8a7a3a" fill-opacity="0.4"/>
  </g>
</svg>
